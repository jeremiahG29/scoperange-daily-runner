{
  "name": "ScopeRange metadata-only connection proof (inactive candidate)",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {},
  "concurrency": {
    "group": "scoperange-metadata-connection-proof-v1",
    "cancel-in-progress": false
  },
  "jobs": {
    "gate": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 1,
      "permissions": {
        "contents": "read"
      },
      "outputs": {
        "authorization": "${{ steps.gate.outputs.authorization }}"
      },
      "steps": [
        {
          "name": "Checkout pinned public control plane",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 1
          }
        },
        {
          "name": "Select pinned Node.js",
          "uses": "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020",
          "with": {
            "node-version": "24.18.0",
            "package-manager-cache": false
          }
        },
        {
          "name": "Evaluate metadata proof non-secret gate",
          "id": "gate",
          "run": "node bootstrap/metadata-connection-proof-gate.js",
          "env": {
            "SCOPERANGE_METADATA_REPOSITORY": "${{ github.repository }}",
            "SCOPERANGE_METADATA_REPOSITORY_ID": "${{ github.repository_id }}",
            "SCOPERANGE_METADATA_REF": "${{ github.ref }}",
            "SCOPERANGE_METADATA_REF_PROTECTED": "${{ github.ref_protected }}",
            "SCOPERANGE_METADATA_WORKFLOW_REF": "${{ github.workflow_ref }}",
            "SCOPERANGE_METADATA_WORKFLOW_SHA": "${{ github.workflow_sha }}",
            "SCOPERANGE_METADATA_EVENT_NAME": "${{ github.event_name }}",
            "SCOPERANGE_METADATA_RUN_ATTEMPT": "${{ github.run_attempt }}",
            "SCOPERANGE_METADATA_OBSERVED_COMMIT": "${{ github.sha }}",
            "SCOPERANGE_METADATA_APPROVED_COMMIT": "${{ vars.SCOPERANGE_APPROVED_PUBLIC_COMMIT }}",
            "SCOPERANGE_METADATA_SOURCE_LOCK_DIGEST": "sha256:09b3c1fba0edd320aa59d2918f7e9398f5530faa62161824f151505842d35ecf",
            "SCOPERANGE_METADATA_EXPECTED_SOURCE_LOCK_DIGEST": "sha256:09b3c1fba0edd320aa59d2918f7e9398f5530faa62161824f151505842d35ecf",
            "SCOPERANGE_METADATA_LIFECYCLE_STATE": "clear",
            "SCOPERANGE_METADATA_DUPLICATE_STATE": "clear",
            "SCOPERANGE_METADATA_RECURRENCE_AUTHORIZED": "false",
            "SCOPERANGE_METADATA_ACQUISITION_AUTHORIZED": "false",
            "SCOPERANGE_METADATA_INGESTION_AUTHORIZED": "false",
            "SCOPERANGE_METADATA_PROMOTION_AUTHORIZED": "false",
            "SCOPERANGE_METADATA_PRICING_AUTHORIZED": "false"
          }
        }
      ]
    },
    "proof": {
      "needs": [
        "gate"
      ],
      "if": "needs.gate.outputs.authorization == 'scoperange-metadata-proof-non-secret-gate-accepted-v1'",
      "environment": "scoperange-production-disabled-v1",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 3,
      "permissions": {
        "contents": "read"
      },
      "steps": [
        {
          "name": "Checkout pinned public control plane",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 1
          }
        },
        {
          "name": "Select pinned Node.js",
          "uses": "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020",
          "with": {
            "node-version": "24.18.0",
            "package-manager-cache": false
          }
        },
        {
          "name": "Run disabled metadata proof entry",
          "run": "node bootstrap/metadata-connection-proof-entry.js",
          "env": {
            "SCOPERANGE_CONFIG_VERSION": "${{ secrets.SCOPERANGE_CONFIG_VERSION }}",
            "SCOPERANGE_CREDENTIAL_EXPIRES_AT": "${{ secrets.SCOPERANGE_CREDENTIAL_EXPIRES_AT }}",
            "SCOPERANGE_CREDENTIAL_NOT_BEFORE": "${{ secrets.SCOPERANGE_CREDENTIAL_NOT_BEFORE }}",
            "SCOPERANGE_CREDENTIAL_VERSION": "${{ secrets.SCOPERANGE_CREDENTIAL_VERSION }}",
            "SCOPERANGE_DB_HOST": "${{ secrets.SCOPERANGE_DB_HOST }}",
            "SCOPERANGE_DB_NAME": "${{ secrets.SCOPERANGE_DB_NAME }}",
            "SCOPERANGE_DB_PASSWORD": "${{ secrets.SCOPERANGE_DB_PASSWORD }}",
            "SCOPERANGE_DB_PORT": "${{ secrets.SCOPERANGE_DB_PORT }}",
            "SCOPERANGE_DB_TLS_SERVER_NAME": "${{ secrets.SCOPERANGE_DB_TLS_SERVER_NAME }}",
            "SCOPERANGE_DB_USER": "${{ secrets.SCOPERANGE_DB_USER }}",
            "SCOPERANGE_EXPECTED_PROJECT_DIGEST": "${{ secrets.SCOPERANGE_EXPECTED_PROJECT_DIGEST }}",
            "SCOPERANGE_PRIVATE_SOURCE_DEPLOY_KEY": "${{ secrets.SCOPERANGE_PRIVATE_SOURCE_DEPLOY_KEY }}"
          }
        }
      ]
    }
  }
}
